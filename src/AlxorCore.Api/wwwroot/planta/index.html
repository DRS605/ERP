<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f141b">
<link rel="manifest" href="/planta/manifest.json">
<link rel="icon" href="/planta/icono.svg" type="image/svg+xml">
<title>Planta · volcados</title>
<style>
  :root { --bg:#0f141b; --card:#18202b; --txt:#e6e9ee; --muted:#98a2b3; --line:#2a3441; --accent:#5b8def; --ok:#47cd89; --warn:#fdb022; --neg:#f97066; --okbg:#0b3b24; --negbg:#4a1714; }
  @media (prefers-color-scheme: light) { :root { --bg:#f2f4f7; --card:#fff; --txt:#101828; --muted:#667085; --line:#d0d5dd; --accent:#2563eb; --ok:#067647; --warn:#b54708; --neg:#b42318; --okbg:#dcfae6; --negbg:#fee4e2; } }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  header small { color:var(--muted); display:block; }
  .estado { display:flex; align-items:center; gap:6px; font-size:13px; white-space:nowrap; }
  .punto { width:10px; height:10px; border-radius:50%; background:var(--neg); }
  .punto.on { background:var(--ok); }
  main { max-width:820px; margin:0 auto; padding:12px 16px 24px; }
  .fila2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:520px) { .fila2 { grid-template-columns:1fr; } }
  label { display:block; font-size:12px; color:var(--muted); margin:0 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  select, input { width:100%; font:inherit; font-size:18px; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--txt); }
  #lectura { font-size:24px; font-family:ui-monospace,Menlo,monospace; letter-spacing:.03em; padding:16px; border:2px solid var(--accent); }
  .lector { display:flex; gap:8px; margin:14px 0 8px; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 16px; background:var(--accent); color:#fff; cursor:pointer; }
  button.sec { background:var(--card); color:var(--txt); border:1px solid var(--line); }
  button:disabled { opacity:.5; }
  #aviso { min-height:64px; border-radius:12px; padding:12px 14px; margin:8px 0 14px; background:var(--card); border:1px solid var(--line); font-size:18px; }
  #aviso.ok { background:var(--okbg); border-color:var(--ok); }
  #aviso.err { background:var(--negbg); border-color:var(--neg); }
  #aviso small { display:block; color:var(--muted); font-size:14px; }
  .cifras { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .cifra { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .cifra b { display:block; font-size:24px; }
  .cifra span { color:var(--muted); font-size:12px; }
  .lista { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .item { display:flex; justify-content:space-between; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); align-items:center; }
  .item:last-child { border-bottom:0; }
  .item .d { min-width:0; }
  .item .mono { font-family:ui-monospace,Menlo,monospace; font-size:14px; }
  .item small { display:block; color:var(--muted); }
  .tag { font-size:12px; font-weight:700; padding:3px 8px; border-radius:99px; white-space:nowrap; }
  .tag.ok { color:var(--ok); border:1px solid var(--ok); } .tag.pend { color:var(--warn); border:1px solid var(--warn); } .tag.err { color:var(--neg); border:1px solid var(--neg); }
  .acciones { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
  .centro { text-align:center; padding:60px 16px; color:var(--muted); }
  video { width:100%; border-radius:12px; margin-top:8px; display:none; }
  .vacio { padding:16px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div><h1 id="titulo">Planta · volcados</h1><small id="subtitulo"></small></div>
  <div class="estado"><span class="punto" id="punto"></span><span id="red">Sin conexión</span></div>
</header>
<main id="main"><div class="centro">Cargando…</div></main>
<script>
  "use strict";
  const main = document.getElementById("main");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const kg = n => Math.round(Number(n || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " kg";
  const hora = iso => { const d = new Date(iso); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
  const hoyLocal = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

  // ---- Almacenamiento local (sobrevive a cerrar la app y a quedarse sin red). Si el navegador no deja guardar, se
  // trabaja en memoria y se avisa.
  const memoria = {};
  let persistente = true;
  function leer(k, def) { try { const v = localStorage.getItem("planta." + k); return v === null ? def : JSON.parse(v); } catch (e) { persistente = false; return k in memoria ? memoria[k] : def; } }
  function guardar(k, v) { memoria[k] = v; try { localStorage.setItem("planta." + k, JSON.stringify(v)); } catch (e) { persistente = false; } }

  let clave = leer("clave", null), token = leer("token", null), datos = leer("datos", null), cola = leer("cola", []);
  let enviando = false, enLinea = navigator.onLine, revocado = false;

  // ---- SSCC: lo mismo que el servidor (18 dígitos, «(00)…», «00…» o el GS1-128 completo, con su dígito de control).
  function gs1Valido(c) { const n = c.length; let s = 0; for (let i = 0; i < n - 1; i++) s += (+c[i]) * ((n - 1 - i) % 2 === 1 ? 3 : 1); return (10 - s % 10) % 10 === +c[n - 1]; }
  function ssccDeLectura(t) {
    if (!t) return null;
    t = t.trim(); if (t.startsWith("]C1")) t = t.slice(3);
    const d = t.replace("(00)", "00").replace(/\D/g, "");
    const c = d.length === 18 ? d : (d.length >= 20 && d.startsWith("00") ? d.slice(2, 20) : null);
    return c && gs1Valido(c) ? c : null;
  }

  // ---- Avisos al operario: color, sonido y vibración (con guantes y ruido, el sonido importa).
  let audio = null;
  function pitido(bien) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = bien ? 1320 : 220; o.type = bien ? "sine" : "square"; g.gain.value = 0.15;
      o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + (bien ? 0.12 : 0.5));
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate(bien ? 60 : [200, 80, 200]); } catch (e) {}
  }
  // El último aviso se conserva al repintar la pantalla.
  let ultimoAviso = null;
  const htmlAviso = a => esc(a.texto) + (a.detalle ? `<small>${esc(a.detalle)}</small>` : "");
  function aviso(texto, detalle, tipo) {
    ultimoAviso = { texto, detalle, tipo: tipo || "" };
    const a = document.getElementById("aviso"); if (!a) return;
    a.className = ultimoAviso.tipo; a.innerHTML = htmlAviso(ultimoAviso);
  }

  // ---- Red.
  function pintarRed() {
    document.getElementById("punto").className = "punto" + (enLinea ? " on" : "");
    document.getElementById("red").textContent = revocado ? "Acceso revocado" : enLinea ? "Conectado" : "Sin conexión";
  }
  async function entrar() {
    const r = await fetch("/portal/entrar", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ clave }) });
    if (r.status === 401) { revocado = true; throw new Error("revocado"); }
    if (!r.ok) throw new Error("red");
    token = (await r.json()).token; guardar("token", token); revocado = false;
  }
  async function api(ruta, opciones = {}, reintento = true) {
    if (!token) await entrar();
    const r = await fetch(ruta, { ...opciones, headers: { "Content-Type":"application/json", Authorization: "Bearer " + token } });
    if (r.status === 401 && reintento) { token = null; await entrar(); return api(ruta, opciones, false); }
    if (r.status === 401) { revocado = true; throw new Error("revocado"); }
    if (!r.ok) { const p = await r.json().catch(() => ({})); const e = new Error(p.title || "Error " + r.status); e.http = r.status; throw e; }
    return r.json();
  }

  async function cargarDatos() {
    try {
      datos = await api("/portal/planta/datos"); guardar("datos", datos); enLinea = true;
    } catch (e) { if (e.message !== "revocado") enLinea = false; }
    pintarRed(); pintar();
  }

  // ---- Cola: cada lectura lleva su clave; reenviarla no la duplica, así que se puede reintentar sin miedo.
  async function enviar() {
    const pendientes = cola.filter(x => x.estado === "pendiente").slice(0, 200);
    if (enviando || pendientes.length === 0 || revocado) return;
    enviando = true;
    try {
      const res = await api("/portal/planta/volcados", { method:"POST", body: JSON.stringify({ volcados: pendientes.map(x => ({ clave:x.clave, sscc:x.sscc, lineaId:x.lineaId, ordenId:x.ordenId, volcadoEn:x.volcadoEn })) }) });
      enLinea = true;
      for (const r of res) {
        const x = cola.find(c => c.clave === r.clave); if (!x) continue;
        if (r.estado === "error") { x.estado = "error"; x.mensaje = r.mensaje; x.codigo = r.codigo; pitido(false); aviso("Rechazado: " + x.sscc, r.mensaje, "err"); }
        else { x.estado = "ok"; x.kilos = r.volcado?.kilos ?? x.kilos; x.producto = r.volcado?.producto ?? x.producto; x.agricultor = r.volcado?.agricultor ?? x.agricultor; }
      }
      guardar("cola", cola);
    } catch (e) {
      if (e.message !== "revocado" && !e.http) enLinea = false;
    } finally { enviando = false; pintarRed(); pintar(); }
    if (cola.some(x => x.estado === "pendiente") && enLinea && !revocado) setTimeout(enviar, 500);
  }

  function nuevaClave() {
    try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
  }

  function leerCodigo(texto) {
    const linea = leer("linea", null);
    if (!linea) { pitido(false); aviso("Elige primero la línea", "", "err"); return; }
    const sscc = ssccDeLectura(texto);
    if (!sscc) { pitido(false); aviso("No es una etiqueta de palé", "«" + texto + "»: lee el código SSCC del palot.", "err"); return; }
    const previo = cola.find(x => x.sscc === sscc && x.estado !== "error" && x.dia === hoyLocal());
    if (previo) { pitido(false); aviso("Este palot ya está volcado", `${sscc} · a las ${hora(previo.volcadoEn)}`, "err"); return; }
    const info = (datos?.pales || []).find(p => p.sscc === sscc);
    const x = { clave: nuevaClave(), sscc, lineaId: linea, ordenId: leer("orden", null) || null, volcadoEn: new Date().toISOString(), dia: hoyLocal(),
      estado: "pendiente", kilos: info?.kilos, producto: info?.producto, agricultor: info?.agricultor };
    cola.unshift(x);
    // Se guardan las lecturas de hoy y las que falten por mandar; del resto, las 300 últimas.
    cola = cola.filter((c, i) => c.estado === "pendiente" || c.dia === hoyLocal() || i < 300);
    guardar("cola", cola);
    pitido(true);
    aviso(info ? `${info.producto} · ${kg(info.kilos)}` : "Palot leído", info ? `${sscc}${info.agricultor ? " · " + info.agricultor : ""}` : `${sscc} · no está en los datos descargados: se comprobará al enviar`, "ok");
    pintar(); enviar();
  }

  // ---- Cámara (si el navegador sabe leer códigos); si no, el lector USB o Bluetooth hace de teclado.
  let flujo = null;
  async function camara() {
    const v = document.getElementById("video");
    if (flujo) { flujo.getTracks().forEach(t => t.stop()); flujo = null; v.style.display = "none"; return; }
    if (!("BarcodeDetector" in window)) { aviso("Este navegador no lee códigos con la cámara", "Usa el lector o escribe el SSCC.", "err"); return; }
    try {
      const det = new BarcodeDetector({ formats: ["code_128", "ean_13", "data_matrix", "qr_code"] });
      flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      v.srcObject = flujo; v.style.display = "block"; await v.play();
      let ultimo = "", cuando = 0;
      const buscar = async () => {
        if (!flujo) return;
        try { for (const c of await det.detect(v)) { if (c.rawValue !== ultimo || Date.now() - cuando > 3000) { ultimo = c.rawValue; cuando = Date.now(); leerCodigo(c.rawValue); } } } catch (e) {}
        requestAnimationFrame(buscar);
      };
      buscar();
    } catch (e) { aviso("No se puede abrir la cámara", e.message, "err"); }
  }

  function descartar(claveLectura) { cola = cola.filter(x => x.clave !== claveLectura); guardar("cola", cola); pintar(); }
  function elegirLinea(v) { guardar("linea", v || null); guardar("orden", null); ultimoAviso = null; pintar(); }
  function elegirOrden(v) { guardar("orden", v || null); pintar(); }

  function pintar() {
    if (!clave) { main.innerHTML = `<div class="centro">Abre en este dispositivo el enlace del terminal que se crea en el ERP<br>(Configuración → Portal y terminales).</div>`; return; }
    if (revocado) { main.innerHTML = `<div class="centro">Este terminal tiene el acceso revocado o caducado. Pide un enlace nuevo.${cola.some(x => x.estado === "pendiente") ? `<br><br><strong>Quedan ${cola.filter(x => x.estado === "pendiente").length} lecturas sin enviar</strong>: se mandarán al abrir el enlace nuevo en este mismo dispositivo.` : ""}</div>`; return; }
    if (!datos) { main.innerHTML = `<div class="centro">Para empezar, el terminal necesita conexión una vez para descargar las líneas y los palés.</div>`; return; }
    document.getElementById("subtitulo").textContent = datos.terminal + " · datos de " + hora(datos.generadoEn);
    const linea = leer("linea", null), orden = leer("orden", null);
    const ordenes = (datos.ordenes || []).filter(o => o.lineaId === linea);
    const hoy = cola.filter(x => x.dia === hoyLocal() && x.estado !== "error" && (!linea || x.lineaId === linea));
    const pend = cola.filter(x => x.estado === "pendiente").length, errores = cola.filter(x => x.estado === "error");
    const enfoque = document.activeElement?.id === "lectura" || !document.getElementById("lectura");
    main.innerHTML = `
      <div class="fila2">
        <div><label for="linea">Línea</label><select id="linea" onchange="elegirLinea(this.value)"><option value="">— Elige la línea —</option>${datos.lineas.map(l => `<option value="${l.id}" ${l.id === linea ? "selected" : ""}>${esc(l.codigo)} · ${esc(l.nombre)}</option>`).join("")}</select></div>
        <div><label for="orden">Orden</label><select id="orden" onchange="elegirOrden(this.value)" ${linea ? "" : "disabled"}><option value="">Sin orden</option>${ordenes.map(o => `<option value="${o.id}" ${o.id === orden ? "selected" : ""}>T${o.turno} · ${o.secuencia}. ${esc(o.producto)} · ${kg(o.kilos)}</option>`).join("")}</select></div>
      </div>
      <div class="lector"><input id="lectura" inputmode="numeric" autocomplete="off" placeholder="Lee la etiqueta del palot" aria-label="Lectura del palot"><button class="sec" onclick="camara()" title="Leer con la cámara">📷</button></div>
      <video id="video" playsinline muted></video>
      <div id="aviso" class="${ultimoAviso?.tipo || ""}">${ultimoAviso ? htmlAviso(ultimoAviso) : linea ? "Listo para leer." : "Elige la línea para empezar."}</div>
      <div class="cifras">
        <div class="cifra"><b>${hoy.length}</b><span>palots hoy</span></div>
        <div class="cifra"><b>${kg(hoy.reduce((s, x) => s + (x.kilos || 0), 0))}</b><span>volcados hoy</span></div>
        <div class="cifra"><b style="color:${pend ? "var(--warn)" : "inherit"}">${pend}</b><span>por enviar</span></div>
      </div>
      ${errores.length ? `<div class="lista" style="margin-bottom:14px">${errores.map(x => `<div class="item"><div class="d"><span class="mono">${esc(x.sscc)}</span><small>${hora(x.volcadoEn)} · ${esc(x.mensaje || "Rechazado")}</small></div><button class="sec" onclick="descartar('${x.clave}')">Descartar</button></div>`).join("")}</div>` : ""}
      <div class="lista">${cola.filter(x => x.estado !== "error").slice(0, 40).map(x => `<div class="item"><div class="d"><span class="mono">${esc(x.sscc)}</span><small>${hora(x.volcadoEn)} · ${esc(x.producto || "?")}${x.agricultor ? " · " + esc(x.agricultor) : ""}${x.kilos ? " · " + kg(x.kilos) : ""}</small></div>${x.estado === "ok" ? '<span class="tag ok">Enviado</span>' : '<span class="tag pend">Pendiente</span>'}</div>`).join("") || '<div class="vacio">Todavía no hay lecturas.</div>'}</div>
      <div class="acciones"><button class="sec" onclick="enviar()" ${pend ? "" : "disabled"}>Enviar ahora</button><button class="sec" onclick="cargarDatos()">Actualizar datos</button></div>
      ${persistente ? "" : '<p style="color:var(--neg)">Este navegador no deja guardar datos: si se cierra la app, se pierden las lecturas sin enviar.</p>'}`;
    const entrada = document.getElementById("lectura");
    entrada.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); const t = entrada.value; entrada.value = ""; leerCodigo(t); } });
    if (enfoque && linea) entrada.focus();
  }

  window.addEventListener("online", () => { enLinea = true; pintarRed(); enviar(); });
  window.addEventListener("offline", () => { enLinea = false; pintarRed(); });
  // Los lectores escriben como un teclado: si el foco se pierde, vuelve a la casilla de lectura.
  document.addEventListener("click", e => { if (!e.target.closest("select,button,input,video")) document.getElementById("lectura")?.focus(); });

  (async () => {
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/planta/sw.js", { scope: "/planta/" }).catch(() => {});
    const delEnlace = decodeURIComponent(location.hash.slice(1));
    if (delEnlace) {
      if (delEnlace !== clave) { clave = delEnlace; guardar("clave", clave); token = null; guardar("token", null); revocado = false; }
      history.replaceState(null, "", location.pathname);
    }
    pintarRed(); pintar();
    if (!clave) return;
    await cargarDatos();
    enviar();
    setInterval(enviar, 15000);
    setInterval(cargarDatos, 10 * 60000);
  })();
</script>
</body>
</html>
